<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人作品集</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121e;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --accent: #00d4ff;
      --accent-hover: #00a3cc;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --shadow: 0 8px 32px rgba(0, 212, 255, 0.1);
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .main-content {
      flex: 1;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-hover);
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 2rem;
    }

    .navbar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .navbar-logo {
      font-size: 1.2rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .navbar-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .navbar-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .navbar-links a:hover {
      color: var(--accent);
    }

    .navbar-links a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .navbar-links a:hover::after {
      width: 100%;
    }

    .home {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem 2rem;
      position: relative;
    }

    .home-content {
      z-index: 1;
      max-width: 800px;
    }

    .home-name {
      font-size: 5rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text-primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .home-title-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      width: 100%;
    }

    .home-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0;
      color: white;
      text-align: center;
    }

    .cursor {
      width: 2px;
      height: 1.5rem;
      background-color: var(--accent);
      margin-left: 0.2rem;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }
      51%, 100% {
        opacity: 0;
      }
    }

    .home-cta-container {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .home-cta {
      display: inline-block;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, var(--accent), #0099cc);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
    }

    .home-cta.secondary {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      box-shadow: none;
    }

    .home-cta:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
    }

    .home-cta.secondary:hover {
      background: var(--accent);
      color: white;
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
    }

    .portfolio {
      padding: 2rem 2rem 4rem;
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .portfolio-title {
      font-size: 2.5rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6rem;
      color: var(--text-primary);
      z-index: 10;
    }

    .portfolio-gallery {
      position: relative;
      width: 100%;
      height: 500px;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }

    .portfolio-gallery:active {
      cursor: grabbing;
    }

    .portfolio-card {
      position: absolute;
      width: 320px;
      height: 400px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      will-change: transform, opacity;
      transform-origin: center;
    }

    .portfolio-card-content {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.4s ease;
    }

    .portfolio-card-content:hover {
      border-color: var(--accent);
      box-shadow: 0 12px 40px rgba(0, 212, 255, 0.3);
      transform: scale(1.05);
    }

    .portfolio-card-image {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      color: var(--accent);
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .portfolio-card-image::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, transparent, rgba(0, 212, 255, 0.1), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .portfolio-card-content:hover .portfolio-card-image::before {
      transform: translateX(100%);
    }

    .portfolio-card-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .portfolio-card-description {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .portfolio-card-link {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      position: relative;
    }

    .portfolio-card-link::after {
      content: '→';
      margin-left: 0.5rem;
      transition: transform 0.3s ease;
    }

    .portfolio-card-link:hover::after {
      transform: translateX(5px);
    }

    .about {
      padding: 8rem 2rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: var(--bg-primary);
    }

    .about-title {
      font-size: 2.5rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 4rem;
      color: var(--text-primary);
    }

    .about-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .about-text {
      color: var(--text-secondary);
      line-height: 1.8;
    }

    .about-text h3 {
      color: var(--text-primary);
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    .about-skills {
      margin-top: 2rem;
    }

    .about-skills h4 {
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .about-skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .about-skill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 0.5rem 1rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .about-card {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 3rem;
      position: relative;
      z-index: 1;
    }

    .about-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .about-item:last-child {
      border-bottom: none;
    }

    .about-label {
      font-size: 1.2rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .about-value {
      font-size: 1.2rem;
      color: var(--text-primary);
      font-weight: 600;
    }

    .message-board {
      padding: 4rem 2rem;
      background: var(--bg-primary);
      text-align: center;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .message-board .particle-bg {
      z-index: 0;
    }

    .message-board h2,
    .message-board p,
    .message-board form {
      position: relative;
      z-index: 2;
    }

    .message-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .message-intro {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .message-form {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      z-index: 2;
    }

    .message-form-row {
      display: flex;
      gap: 1rem;
    }

    .message-input {
      flex: 1;
      padding: 0.8rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .message-input:focus {
      outline: none;
      border-color: rgba(0, 212, 255, 0.3);
    }

    .message-input::placeholder {
      color: var(--text-secondary);
    }

    .message-textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      transition: all 0.3s ease;
    }

    .message-textarea:focus {
      outline: none;
      border-color: rgba(0, 212, 255, 0.3);
    }

    .message-textarea::placeholder {
      color: var(--text-secondary);
    }

    .message-btn {
      padding: 0.8rem 2rem;
      background: rgba(0, 212, 255, 0.85);
      color: var(--bg-primary);
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .message-btn:hover {
      background: var(--accent);
      transform: translateY(-1px);
    }

    .contact {
      position: relative;
      padding: 4rem 2rem;
      background: var(--bg-primary);
      text-align: center;
      overflow: hidden;
    }

    .contact-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
    }

    .contact-title {
      font-size: 2.5rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 2rem;
      color: var(--text-primary);
    }

    .contact-intro {
      color: var(--text-secondary);
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 3rem;
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      background: var(--bg-primary);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-primary);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .contact-link:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 5px 20px rgba(0, 212, 255, 0.2);
    }

    .contact-icon {
      font-size: 1.5rem;
    }

    .contact-text {
      font-size: 1rem;
    }

    .footer {
      padding: 2rem;
      text-align: center;
      border-top: 1px solid var(--card-border);
      margin-top: 0;
      background: var(--bg-secondary);
      width: 100%;
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1rem;
    }

    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    .footer-copyright {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .particle-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 1rem;
      }

      .navbar-links {
        gap: 1rem;
      }

      .home-title {
        font-size: 2.5rem;
      }

      .home-subtitle {
        font-size: 1.2rem;
      }

      .portfolio {
        padding: 6rem 1rem 2rem;
      }

      .portfolio-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .portfolio-card:nth-child(even),
      .portfolio-card:nth-child(3n) {
        margin-top: 0;
      }

      .about {
        padding: 6rem 1rem 2rem;
      }

      .about-content {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .footer-links {
        gap: 1rem;
      }

    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.8s ease forwards;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid var(--card-border);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ParticleBackground = ({ 
      particleCount = 100, 
      particleColor = '#ffffff', 
      minSize = 1, 
      maxSize = 3, 
      animationSpeed = 0.5 
    }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * (maxSize - minSize) + minSize,
            speedX: (Math.random() - 0.5) * animationSpeed,
            speedY: (Math.random() - 0.5) * animationSpeed,
            opacity: Math.random() * 0.8 + 0.2
          });
        }

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          particles.forEach(particle => {
            particle.x += particle.speedX;
            particle.y += particle.speedY;

            if (particle.x < 0) particle.x = canvas.width;
            if (particle.x > canvas.width) particle.x = 0;
            if (particle.y < 0) particle.y = canvas.height;
            if (particle.y > canvas.height) particle.y = 0;

            ctx.beginPath();
            ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
            ctx.fillStyle = `${particleColor}${Math.floor(particle.opacity * 255).toString(16).padStart(2, '0')}`;
            ctx.fill();

            particles.forEach(otherParticle => {
              const dx = particle.x - otherParticle.x;
              const dy = particle.y - otherParticle.y;
              const distance = Math.sqrt(dx * dx + dy * dy);

              if (distance < 100) {
                ctx.beginPath();
                ctx.strokeStyle = `${particleColor}${Math.floor((0.2 - distance / 500) * 255).toString(16).padStart(2, '0')}`;
                ctx.lineWidth = 0.5;
                ctx.moveTo(particle.x, particle.y);
                ctx.lineTo(otherParticle.x, otherParticle.y);
                ctx.stroke();
              }
            });
          });

          requestAnimationFrame(animate);
        };

        animate();

        return () => {
          window.removeEventListener('resize', resizeCanvas);
        };
      }, [particleCount, particleColor, minSize, maxSize, animationSpeed]);

      return (
        <canvas
          ref={canvasRef}
          className="particle-bg"
          style={{
            position: 'absolute',
            top: 0,
            left: 0,
            right: 0,
            bottom: 0,
            zIndex: 0
          }}
        />
      );
    };

    const ADMIN_PASSWORD = 'admin@123';

    const AdminLogin = ({ onLogin }) => {
      const [password, setPassword] = useState('');
      const [error, setError] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (password === ADMIN_PASSWORD) {
          localStorage.setItem('adminLoggedIn', 'true');
          onLogin();
        } else {
          setError(true);
        }
      };

      return (
        <div style={{ 
          minHeight: '100vh', 
          padding: '6rem 2rem', 
          backgroundColor: '#0a0a0f',
          position: 'relative',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center'
        }}>
          <ParticleBackground />
          <div style={{ 
            maxWidth: '400px', 
            width: '100%',
            position: 'relative', 
            zIndex: 1,
            backgroundColor: '#1a1a2e',
            borderRadius: '12px',
            padding: '3rem',
            boxShadow: '0 8px 32px rgba(0, 0, 0, 0.3)'
          }}>
            <h1 style={{ 
              fontSize: '2rem', 
              fontWeight: '800', 
              textAlign: 'center', 
              marginBottom: '2rem',
              color: '#ffffff',
              background: 'linear-gradient(135deg, #ffffff, #00d4ff)',
              WebkitBackgroundClip: 'text',
              WebkitTextFillColor: 'transparent',
              backgroundClip: 'text'
            }}>
              后台管理登录
            </h1>
            
            <form onSubmit={handleSubmit}>
              <div style={{ marginBottom: '1.5rem' }}>
                <label style={{ 
                  display: 'block', 
                  color: '#ffffff', 
                  marginBottom: '0.5rem',
                  fontWeight: '500'
                }}>
                  管理员密码
                </label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => {
                    setPassword(e.target.value);
                    setError(false);
                  }}
                  placeholder="请输入管理员密码"
                  style={{
                    width: '100%',
                    padding: '0.8rem 1rem',
                    backgroundColor: 'rgba(255, 255, 255, 0.05)',
                    border: error ? '1px solid #ff4444' : '1px solid rgba(255, 255, 255, 0.1)',
                    borderRadius: '6px',
                    color: '#ffffff',
                    fontSize: '1rem',
                    outline: 'none',
                    transition: 'all 0.3s'
                  }}
                  onFocus={(e) => e.target.style.borderColor = '#00d4ff'}
                  onBlur={(e) => e.target.style.borderColor = error ? '#ff4444' : 'rgba(255, 255, 255, 0.1)'}
                />
                {error && (
                  <p style={{ 
                    color: '#ff4444', 
                    fontSize: '0.9rem',
                    marginTop: '0.5rem'
                  }}>
                    密码错误，请重试！
                  </p>
                )}
              </div>
              
              <button 
                type="submit"
                style={{
                  width: '100%',
                  padding: '0.8rem',
                  backgroundColor: '#00d4ff',
                  color: '#0a0a0f',
                  border: 'none',
                  borderRadius: '6px',
                  fontSize: '1rem',
                  fontWeight: '600',
                  cursor: 'pointer',
                  transition: 'all 0.3s'
                }}
                onMouseOver={(e) => e.currentTarget.style.backgroundColor = '#00a3cc'}
                onMouseOut={(e) => e.currentTarget.style.backgroundColor = '#00d4ff'}
              >
                登录
              </button>
            </form>
            
            <p style={{ 
              textAlign: 'center',
              color: '#a0a0b0',
              fontSize: '0.85rem',
              marginTop: '1.5rem'
            }}>
              默认密码：admin@123
            </p>
          </div>
        </div>
      );
    };

    const AdminPanel = () => {
      const [contacts, setContacts] = useState([]);
      const [loading, setLoading] = useState(true);

      const fetchContacts = async () => {
        setLoading(true);
        try {
